services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ianamed
      POSTGRES_USER: ${POSTGRES_USER:-ianamed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      # POSTGRES_PORT permite usar otro puerto si ya hay un PostgreSQL instalado en el equipo (p. ej. 5433).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ianamed} -d ianamed"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
