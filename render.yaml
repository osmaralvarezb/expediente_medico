# Blueprint de Render: API de IanaMed (Incremento 1) + PostgreSQL administrado.
# Render > New > Blueprint > seleccionar este repositorio. Pide SEED_PASSWORD al crear.
services:
  - type: web
    name: ianamed-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci
    # Migraciones idempotentes y usuarios de prueba (Argon2id) en cada arranque; después, la API.
    startCommand: npm run db:migrate && npm run db:seed && npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ianamed-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render pone un proxy delante de la app: req.ip toma la IP que ese proxy reporta.
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_PASSWORD
        sync: false

databases:
  - name: ianamed-db
    plan: free
    region: oregon
    databaseName: ianamed
    user: ianamed
