# Blueprint de Render: API de IanaMed (Incremento 1) + PostgreSQL administrado.
# Render > New > Blueprint > seleccionar este repositorio. Pide SEED_PASSWORD al crear.
services:
  - type: web
    name: ianamed-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci
    # Migraciones idempotentes y usuarios de prueba (Argon2id) en cada arranque; después, la API.
    startCommand: npm run db:migrate && npm run db:seed && npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ianamed-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # En Render hay 3 saltos: cliente -> Cloudflare -> balanceador de Render -> app.
      # Con 3, req.ip es la IP real del cliente (verificado: el 6.o login da 429 aunque se falsifique X-Forwarded-For).
      - key: TRUST_PROXY
        value: "3"
      - key: SEED_PASSWORD
        sync: false

databases:
  - name: ianamed-db
    plan: free
    region: oregon
    databaseName: ianamed
    user: ianamed
