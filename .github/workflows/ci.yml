# Integración continua: pruebas unitarias en cada push y Pull Request (Plan TSP §7).
name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      # API del Sprint 1: unitarias, supertest e integración con PostgreSQL (PGlite).
      - run: npm run test:api
